tooltip-help=Help: language, signals, combinator library and examples.
help-title=Pythonator help
help-insert=Insert into editor
tooltip-help-insert=Replaces the editor text with this example (only while paused). Run it with ▶.
help-basics-title=Basics
help-basics-text=A program must define [font=default-bold]loop()[/font]. Pythonator calls it once per tick (or once per interval from config()). Top-level code runs once on start – that is the initialization.\n\n[font=default-bold]Timing:[/font] in tick T the inputs are read (what others sent in T−1), loop() runs and the outputs are written. Others see them in tick T+1 – exactly like a vanilla combinator. loop() always finishes within one tick.\n\n[font=default-bold]State:[/font] global variables keep their value between ticks and across saves. Assigning to a global inside a function needs "global name" (as in Python). Local variables are discarded when the function returns.\n\n[font=default-bold]Time:[/font] tick = ticks the program has been running (stops while paused and without power), game_tick = game tick, dt = ticks since the previous loop().\n\n[font=default-bold]Program settings[/font] – interval, clearing outputs, building description and icon – go into config(…) at the start of the program (config() tab).\n\n[font=default-bold]Controls:[/font] ▶ starts (changed code is compiled and starts from scratch, otherwise the program continues), ⏸ pauses, ⟳ resets (globals from scratch), ⏭ runs one loop() while paused. While running the editor is read-only – edit while paused.\n\nIndent with spaces – the Tab key does nothing in the editor (pasted text with tabs works). Ready-made pieces of code are inserted with the snippet bar below the editor, a signal icon with the picker in the corner of the editor (Window and ALT tab).
help-signals-title=Signals
help-language-title=Language
help-library-title=Library
help-examples-title=Examples
help-examples-text=Insert an example into the editor while paused with the button below it (replaces the editor text) and run it with ▶.
help-example-hysteresis-title=Hysteresis
help-example-hysteresis-desc=The pump (signal-S) turns on when gas drops below 1000 and off above 20000. The level changes slowly, checking every 10 ticks is enough (config(interval=10)). Writing the same value again is not sent to the wire and costs nothing.
help-example-sequence-title=Sequence with a timer
help-example-sequence-desc=Once per second (config(interval=60) – loop() runs only every 60th tick) advances a sequence step and sends signal A, B, S, U in a loop.
help-example-recipe-title=Assembler recipe
help-example-recipe-desc=An assembler with "Set recipe" gets the item signal – it makes gears until the network has 200. The output is set by a condition instead of out.clear() (no needless writes) and checking twice per second is enough.
help-example-each-title=Surplus (Each)
help-example-each-desc=Once per second sends the surplus of every signal above 1000 and their count on signal-A. The network is read once (where), result and count go into one set and out.set() writes only the difference to the wire.
help-example-pid-title=PID control
help-example-pid-desc=Keeps the gas level at 5000; the control output 0–100 goes to signal-P (e.g. pumping speed). Control runs every tick; pid() uses dt, so it also works with config(interval=N), just reacts slower.
help-performance-title=Performance
help-performance-text=Every loop() run costs CPU time (UPS). The game has 16.7 ms per tick; see the cost of all Pythonators with F4 → show-time-usage → line mod-Pythonator. The bar in the window shows the cost of one program.\n\n[font=default-bold]1. Interval – the biggest saving.[/font] config(interval=N) runs loop() only every Nth tick, the cost drops to roughly 1/N. Pick the reaction speed by task:\n• 1 – safety, control loops, fast train and inserter sequences\n• 10–60 – production, storage, fluid levels\n• 300 and more – slow things (research, statistics, time-based switching)\nBuildings with the same interval each run in a different tick (spread by building number), so there is no spike.\n\n[font=default-bold]2. Write outputs only when they change.[/font] out.clear() plus a new write every tick costs more than the program itself. Write inside a condition that detects the change (if timer(…), if edge(…), when a value changes).\n\n[font=default-bold]3. Read only what you need.[/font] inp["x"] costs about 1 µs per signal; iterating all signals (inp.items(), inp.where(…)) reads the whole network – tens of µs with dozens of signals. Buildings on the same network share the read within a tick.\n\n[font=default-bold]4. Rough numbers (150 buildings with a simple program):[/font]\n• every tick with out.clear() + write: ~2.4 ms per tick (~16 µs per building)\n• every tick, writing only on change: ~1.2 ms (~8 µs per building; ~3 µs is the fixed run overhead)\n• config(interval=60): ~0.2 ms\nA few dozen programs with interval 1 are fine even in a large factory; hundreds of buildings with interval 1 are worth tuning.
help-signals-text=[font=default-bold]Reading inputs[/font] (a missing signal reads 0):\n• [font=default-semibold]inp[k][/font] – sum of the red and green wire, like a combinator input.\n• [font=default-semibold]red[k][/font], [font=default-semibold]green[k][/font] – one wire only.\n\n[font=default-bold]Writing outputs[/font] (the value is truncated towards zero and wraps to int32):\n• [font=default-semibold]out[k] = v[/font] – to both wires.\n• [font=default-semibold]out_red[k] = v[/font], [font=default-semibold]out_green[k] = v[/font] – one wire only; on the wire it adds up with out.\n• [font=default-semibold]out.clear()[/font] – clears the outputs of that object (out_red.clear() only red).\n\n[font=default-bold]Signal keys:[/font]\n• "iron-plate" – item, fluid or virtual signal by name.\n• "iron-plate@rare" – with quality.\n• "recipe:iron-plate", "entity:…", "space-location:…" – another signal type.\n• An icon from the selector in the editor corner, e.g. [item=iron-plate] – same as text, with or without quotes.\nThe compiler reports a typo in a key with a suggestion of the right name.\n\n[font=default-bold]Iterating:[/font]\n• [font=default-semibold]for k, v in inp.items():[/font] – all non-zero signals (also .keys(), .values()).\n• [font=default-semibold]k in inp[/font], [font=default-semibold]len(inp)[/font] – is the signal non-zero, how many there are.\n\n[font=default-bold]Output mode:[/font]\n• config(outputs="hold") – outputs keep their last value (default).\n• config(outputs="clear") – outputs are cleared before every loop().\n\nSet an assembler recipe with the item signal: out["iron-gear-wheel"] = 1.\nThe Outputs panel in the building window shows the actual wire state.
help-language-text=A subset of Python – a program also runs in normal Python.\n\n[font=default-bold]Types:[/font] int, float, bool (True/False), None, str, list [1, 2], dict {"a": 1}, tuple (1, 2).\n\n[font=default-bold]Statements:[/font]\n• [font=default-semibold]if / elif / else[/font] – condition.\n• [font=default-semibold]while condition:[/font] – loop; [font=default-semibold]for x in …:[/font] – iterate range(), list, dict, inp.items() …\n• [font=default-semibold]break[/font], [font=default-semibold]continue[/font], [font=default-semibold]pass[/font].\n• [font=default-semibold]def name(a, b):[/font] … [font=default-semibold]return[/font] – your own function (top level only).\n• [font=default-semibold]global x[/font] – writing a global variable inside a function.\n• a, b = b, a – unpacking; x += 1 and other augmented assignments.\n\n[font=default-bold]Operators:[/font]\n• + - * / (always decimal) // (integer division) % ** (power)\n• comparisons < <= > >= == != also chained 0 < x < 10\n• and, or, not, in, not in, is, a if condition else b\n• bitwise & | ^ ~ << >> (32 bits like the circuit network)\n\n[font=default-bold]Built-in functions:[/font]\n• abs, min, max, round, sum, sorted, len, range – as in Python.\n• int, float, str, bool – conversions.\n• print(…) – writes to the window log (last 50 lines).\n\n[font=default-bold]Methods:[/font]\n• list: append, pop, insert, remove, index, clear\n• dict: get, items, keys, values, pop, clear\n• str: upper, lower, startswith, endswith, split, join, replace\n\n[font=default-bold]Not supported:[/font] classes, import, try/except, lambda, comprehensions, f-strings, with, default and keyword arguments, nested def, set, del.\n[font=default-bold]Differences:[/font] int and float are not distinguished (6 / 2 prints 3); top-level defs are available before their definition.\n\n[font=default-bold]Safety limits:[/font] the watchdog stops a program doing more operations in one tick than the limit; the memory limit watches the size of global variables. Both in map settings.
help-library-text=[font=default-bold]Vector operations[/font] – one call over the whole set of signals (inp, red, green, out… and dict). They work like "Each" in vanilla combinators:\n• [font=default-semibold]x.each(op, v)[/font] – applies op with number v to every signal; returns a dict. op: + - * / % ** << >> & | ^; integers, / and % towards zero, division by zero gives 0.\n   inp.each("*", 2) → every signal doubled.\n• [font=default-semibold]x.where(op, v)[/font] – only signals matching the condition (op: < <= > >= == !=), with their original value.\n   inp.where(">", 1000) → signals above 1000.\n• [font=default-semibold]x.count()[/font], [font=default-semibold]x.count(op, v)[/font] – number of signals (optionally only those matching the condition).\n• [font=default-semibold]x.sum()[/font] – sum of the values.\n• [font=default-semibold]x.max_key()[/font], [font=default-semibold]x.min_key()[/font] – name of the signal with the largest / smallest value (alphabetically first on a tie), None for an empty set.\n• [font=default-semibold]out.set(d)[/font] – replaces the outputs with set d (only the difference goes to the wire). [font=default-semibold]out.add(d)[/font] – adds set d to the outputs.\nOperations can be chained: out.set(inp.where(">", 0).each("*", 2)).\n\n[font=default-bold]Stateful elements[/font] remember their state between ticks. The first argument is always a [font=default-semibold]name[/font] (text): the state is stored under it, survives saving and is cleared by Reset. Every element needs its own name – two calls with the same name share one state. The "Library elements" panel shows the state of all of them. Arguments are positional only (no name=value).\n\n[font=default-semibold]latch(name, set, reset)[/font] → True/False\nA latch – one bit of memory. When set is true it turns on; when reset is true it turns off; when both are true it turns off (reset wins); when neither, it keeps the previous state.\n   on = latch("pump", gas < 1000, gas > 20000) → turns on below 1000, off above 20000, holds in between (hysteresis).\n\n[font=default-semibold]timer(name, period)[/font] → True/False\nTrue once every period game ticks, otherwise False. It uses dt, so it works with interval too (period 60 with interval=10 = every 6th call). After a power outage it fires only once.\n   if timer("report", 300): print(inp["iron-plate"]) → every 5 seconds.\n\n[font=default-semibold]edge(name, value)[/font] → 1 / -1 / 0\nEdge: 1 in the loop() when value became true, -1 when it stopped being true, otherwise 0. For an action that should happen only once on a change.\n   if edge("full", inp["iron-plate"] > 1000) == 1: print("full")\n\n[font=default-semibold]counter(name)[/font], [font=default-semibold]counter(name, step)[/font], [font=default-semibold]counter(name, step, reset)[/font] → number\nCounter: every call adds step (default 1, may be negative). When reset is true it goes back to 0 and returns 0.\n   n = counter("trains", 1, inp["signal-R"] > 0) → counts, signal-R resets it.\n\n[font=default-semibold]delay(name, value, n)[/font] → value\nDelay: returns the value it got n calls ago (n = 1–1000). Until it fills up it returns 0; changing n clears it. It counts loop() calls, not ticks: with interval=10 and n=6 the delay is 60 ticks.\n   change = inp["iron-plate"] - delay("before", inp["iron-plate"], 60) → increase over 60 calls.\n\n[font=default-semibold]pid(name, setpoint, measured, kp, ki, kd)[/font], [font=default-semibold]pid(…, lo, hi)[/font] → number\nA PID controller keeps the measured value (e.g. a tank level) at the setpoint by returning a control value – the number you send to an output (pumping speed, number of machines switched on …). It works with the [font=default-semibold]error[/font] e = setpoint − measured (positive = too little):\n• [font=default-semibold]kp[/font] (proportional) – output = kp × e. Reacts immediately, the bigger the error, the stronger. On its own it usually leaves a small permanent error.\n• [font=default-semibold]ki[/font] (integral) – sums the error over time (every tick) and keeps adding to the output until the error is completely gone. Too large ki = oscillation and overshoot.\n• [font=default-semibold]kd[/font] (derivative) – reacts to how fast the error changes and damps overshoot. In Factorio usually 0 – signals jump and the derivative would amplify the noise.\n• [font=default-semibold]lo, hi[/font] (optional) – output limits, e.g. 0 and 100. The output is clamped to them and the integral stops growing while the output sits at a limit (anti-windup) – so after a long shortage the controller does not overshoot.\nHow to tune: start with ki = kd = 0 and raise kp until the output reacts sensibly to the error; then add a small ki (e.g. kp / 100) and raise it until the permanent error disappears; if the value oscillates, lower ki (and possibly kp). The integral is counted in ticks, so ki is usually small (0.001–0.01).\n   u = pid("level", 5000, inp["petroleum-gas"], 0.02, 0.001, 0, 0, 100)\n   out["signal-P"] = u → the result is a decimal number, the wire gets it truncated to an integer.
help-config-title=config()
help-config-text=[font=default-bold]config(…)[/font] configures the whole program. Write it as a standalone top-level statement (not inside a function), ideally on the first line. Values must be written directly (a number, text in quotes), not taken from a variable – they are read at compile time. Every parameter is optional and config() can be left out completely.\n\nExample:\n[font=pyntr-mono]config(interval=10, outputs="clear", label="Gas monitor", icon="petroleum-gas")[/font]\n\n[font=default-bold]interval=N[/font] – integer ≥ 1, default 1\nloop() runs only every N-th tick (60 = once per second). The building gets roughly N times cheaper (Performance tab). dt in loop() is then N; timer() and pid() take it into account on their own, delay() counts loop() calls, not ticks.\n\n[font=default-bold]outputs="hold" | "clear"[/font] – default "hold"\n• "hold" – an output keeps the last written value until you overwrite it, write 0 or call out.clear(). Good when you write only on change.\n• "clear" – all outputs are cleared before every loop(); the wire carries only what loop() wrote in this run. Good when the output always follows from the current inputs (nothing to forget to clear).\n\n[font=default-bold]label="text"[/font]\nBuilding description. It is shown in the tooltip when you hover over the building – you can tell what it does without opening the window. It is part of the code, so it travels with blueprints and copy-paste of settings.\n\n[font=default-bold]icon="signal"[/font]\nIcon in the middle of the building, always visible (also without ALT). Written as a signal key: "iron-plate", "petroleum-gas", "signal-A", "iron-plate@rare", or with an icon from the picker in the corner of the editor (with or without quotes). A typo is reported by the compiler with a suggestion.\n\nAn unknown parameter or a wrong value is a compile error with a line number. In regular Python config() is just an empty function – the program runs unchanged.
help-window-title=Window and ALT
help-window-text=[font=default-bold]The snippet bar[/font] below the editor inserts a ready-made piece of code. The game does not tell where the cursor is, so the snippet is inserted where you last typed – not where you clicked:\n• an expression (inp[ ], .where, .each) right at that place,\n• a statement (def loop, if, out[ ] =, latch …) on a new line below it with the same indentation (one level deeper after a line ending with a colon); on an empty line it goes onto that line.\nThe first UPPERCASE word (SIGNAL, NUMBER, NAME …) is selected after inserting – just type and it is replaced. A placeholder left in place is reported by the compiler. The button tooltip shows the whole snippet.\n\n[font=default-bold]The icon picker[/font] in the bottom right corner of the editor inserts a signal icon, e.g. [item=iron-plate]. It works with or without quotes – inp[[item=iron-plate]] and inp["[item=iron-plate]"] – so you do not need to know the internal signal name.\n\n[font=default-bold]Panels on the right:[/font] program state and the cost of the last run, signals on the input wires, outputs (actual wire state), global variables and the state of library elements. The Log button below the editor shows the last 50 lines of print().\n\n[font=default-bold]On the building:[/font]\n• LED – blinking green: running, yellow: paused, red: error, off: no code or no power.\n• The display scrolls through the code while running.\n• The icon from config(icon=…) in the middle, the description from config(label=…) in the tooltip.\n\n[font=default-bold]ALT mode[/font] (Alt key) shows above every Pythonator:\n• arrows on the edge – where the input comes from and where the output goes,\n• on the input side the signals the program reads by name (inp["…"], red["…"], green.get("…"), "…" in inp); the Each icon means it reads the whole set (inp.items(), .where(…), len(inp), a key built at runtime),\n• on the output side the signals the building is currently sending to the wires,\n• icon background: dark = both wires (inp, out), red = red only (red, out_red), green = green only; more signals than fit = "+N".\nALT mode does not show signal values (like vanilla combinators) – you find them in the building window.
tips-title=Pythonator – getting started
tips-examples-text=Ready-made programs. In the building window insert them into the editor with the help button (?) → Examples.
