tooltip-help=Help: language, signals, combinator library and examples.
help-title=Pythonator help
help-insert=Insert into editor
tooltip-help-insert=Replaces the editor text with this example (only while paused). Run it with ▶.
help-basics-title=Basics
help-basics-text=A program must define [font=default-bold]loop()[/font]. Pythonator calls it once per tick (or once per interval from config()). Top-level code runs once on start – that is the initialization.\n\n[font=default-bold]Timing:[/font] in tick T the inputs are read (what others sent in T−1), loop() runs and the outputs are written. Others see them in tick T+1 – exactly like a vanilla combinator. loop() always finishes within one tick.\n\n[font=default-bold]State:[/font] global variables keep their value between ticks and across saves. Assigning to a global inside a function needs "global name" (as in Python). Local variables are dropped when the function returns.\n\n[font=default-bold]Time:[/font] tick = ticks the program has run (stops while paused and without power), game_tick = game tick, dt = ticks since the previous loop().\nconfig(interval=N, outputs="hold" | "clear") – only as a top-level statement.\n\n[font=default-bold]Controls:[/font] ▶ runs (changed code is compiled and starts from scratch, otherwise the program continues), ⏸ pauses, ⟳ resets (globals from scratch), ⏭ runs one loop() while paused. The editor is read-only while running – edit while paused.\n\nIndent with spaces – the Tab key does nothing in the editor (pasted text with tabs works). Insert a signal icon with the selector in the editor corner.
help-signals-title=Signals
help-language-title=Language
help-library-title=Library
help-examples-title=Examples
help-examples-text=Insert an example into the editor while paused with the button below it (replaces the editor text) and run it with ▶.
help-example-hysteresis-title=Hysteresis
help-example-hysteresis-desc=The pump (signal-S) turns on when gas drops below 1000 and off above 20000. The level changes slowly, checking every 10 ticks is enough (config(interval=10)). Writing the same value again is not sent to the wire and costs nothing.
help-example-sequence-title=Sequence with a timer
help-example-sequence-desc=Once per second (config(interval=60) – loop() runs only every 60th tick) advances a sequence step and sends signal A, B, S, U in a loop.
help-example-recipe-title=Assembler recipe
help-example-recipe-desc=An assembler with "Set recipe" gets the item signal – it makes gears until the network has 200. The output is set by a condition instead of out.clear() (no needless writes) and checking twice per second is enough.
help-example-each-title=Surplus (Each)
help-example-each-desc=Once per second sends the surplus of every signal above 1000 and their count on signal-A. The network is read once (where), result and count go into one set and out.set() writes only the difference to the wire.
help-example-pid-title=PID control
help-example-pid-desc=Keeps the gas level at 5000; the control output 0–100 goes to signal-P (e.g. pumping speed). Control runs every tick; pid() uses dt, so it also works with config(interval=N), just reacts slower.
help-performance-title=Performance
help-performance-text=Every loop() run costs CPU time (UPS). The game has 16.7 ms per tick; see the cost of all Pythonators with F4 → show-time-usage → line mod-Pythonator. The bar in the window shows the cost of one program.\n\n[font=default-bold]1. Interval – the biggest saving.[/font] config(interval=N) runs loop() only every Nth tick, the cost drops to roughly 1/N. Pick the reaction speed by task:\n• 1 – safety, control loops, fast train and inserter sequences\n• 10–60 – production, storage, fluid levels\n• 300 and more – slow things (research, statistics, time-based switching)\nBuildings with the same interval each run in a different tick (spread by building number), so there is no spike.\n\n[font=default-bold]2. Write outputs only when they change.[/font] out.clear() plus a new write every tick costs more than the program itself. Write inside a condition that detects the change (if timer(…), if edge(…), when a value changes).\n\n[font=default-bold]3. Read only what you need.[/font] inp["x"] costs about 1 µs per signal; iterating all signals (inp.items(), inp.where(…)) reads the whole network – tens of µs with dozens of signals. Buildings on the same network share the read within a tick.\n\n[font=default-bold]4. Rough numbers (150 buildings with a simple program):[/font]\n• every tick with out.clear() + write: ~2.4 ms per tick (~16 µs per building)\n• every tick, writing only on change: ~1.2 ms (~8 µs per building; ~3 µs is the fixed run overhead)\n• config(interval=60): ~0.2 ms\nA few dozen programs with interval 1 are fine even in a large factory; hundreds of buildings with interval 1 are worth tuning.
help-signals-text=[font=default-bold]Reading inputs[/font] (a missing signal reads 0):\n• [font=default-semibold]inp[k][/font] – sum of the red and green wire, like a combinator input.\n• [font=default-semibold]red[k][/font], [font=default-semibold]green[k][/font] – one wire only.\n\n[font=default-bold]Writing outputs[/font] (the value is truncated towards zero and wraps to int32):\n• [font=default-semibold]out[k] = v[/font] – to both wires.\n• [font=default-semibold]out_red[k] = v[/font], [font=default-semibold]out_green[k] = v[/font] – one wire only; on the wire it adds up with out.\n• [font=default-semibold]out.clear()[/font] – clears the outputs of that object (out_red.clear() only red).\n\n[font=default-bold]Signal keys:[/font]\n• "iron-plate" – item, fluid or virtual signal by name.\n• "iron-plate@rare" – with quality.\n• "recipe:iron-plate", "entity:…", "space-location:…" – another signal type.\n• An icon from the selector in the editor corner, e.g. [item=iron-plate] – same as text.\nThe compiler reports a typo in a key with a suggestion of the right name.\n\n[font=default-bold]Iterating:[/font]\n• [font=default-semibold]for k, v in inp.items():[/font] – all non-zero signals (also .keys(), .values()).\n• [font=default-semibold]k in inp[/font], [font=default-semibold]len(inp)[/font] – is the signal non-zero, how many there are.\n\n[font=default-bold]Output mode:[/font]\n• config(outputs="hold") – outputs keep their last value (default).\n• config(outputs="clear") – outputs are cleared before every loop().\n\nSet an assembler recipe with the item signal: out["iron-gear-wheel"] = 1.\nThe Outputs panel in the building window shows the actual wire state.
help-language-text=A subset of Python – a program also runs in normal Python.\n\n[font=default-bold]Types:[/font] int, float, bool (True/False), None, str, list [1, 2], dict {"a": 1}, tuple (1, 2).\n\n[font=default-bold]Statements:[/font]\n• [font=default-semibold]if / elif / else[/font] – condition.\n• [font=default-semibold]while condition:[/font] – loop; [font=default-semibold]for x in …:[/font] – iterate range(), list, dict, inp.items() …\n• [font=default-semibold]break[/font], [font=default-semibold]continue[/font], [font=default-semibold]pass[/font].\n• [font=default-semibold]def name(a, b):[/font] … [font=default-semibold]return[/font] – your own function (top level only).\n• [font=default-semibold]global x[/font] – writing a global variable inside a function.\n• a, b = b, a – unpacking; x += 1 and other augmented assignments.\n\n[font=default-bold]Operators:[/font]\n• + - * / (always decimal) // (integer division) % ** (power)\n• comparisons < <= > >= == != also chained 0 < x < 10\n• and, or, not, in, not in, is, a if condition else b\n• bitwise & | ^ ~ << >> (32 bits like the circuit network)\n\n[font=default-bold]Built-in functions:[/font]\n• abs, min, max, round, sum, sorted, len, range – as in Python.\n• int, float, str, bool – conversions.\n• print(…) – writes to the window log (last 50 lines).\n\n[font=default-bold]Methods:[/font]\n• list: append, pop, insert, remove, index, clear\n• dict: get, items, keys, values, pop, clear\n• str: upper, lower, startswith, endswith, split, join, replace\n\n[font=default-bold]Not supported:[/font] classes, import, try/except, lambda, comprehensions, f-strings, with, default and keyword arguments, nested def, set, del.\n[font=default-bold]Differences:[/font] int and float are not distinguished (6 / 2 prints 3); top-level defs are available before their definition.\n\n[font=default-bold]Safety limits:[/font] the watchdog stops a program doing more operations in one tick than the limit; the memory limit watches the size of global variables. Both in map settings.
help-library-text=[font=default-bold]Vector operations[/font] – one call over the whole set of signals (inp, red, green, out… and dict):\n• [font=default-semibold]x.each(op, v)[/font] – every signal op v, like Each in an arithmetic combinator. op: + - * / % ** << >> & | ^; integers, / and % towards zero, division by zero gives 0. The result is a dict.\n   Example: inp.each("*", 2) → every signal doubled.\n• [font=default-semibold]x.where(op, v)[/font] – only signals matching the condition (op: < <= > >= == !=), with their original value – like Each in a decider combinator.\n   Example: inp.where(">", 1000) → signals above 1000.\n• [font=default-semibold]x.count()[/font], [font=default-semibold]x.count(op, v)[/font] – number of signals (optionally only those matching).\n• [font=default-semibold]x.sum()[/font] – sum of values.\n• [font=default-semibold]x.max_key()[/font], [font=default-semibold]x.min_key()[/font] – key with the largest / smallest value (ties: smaller key), None for an empty set.\n• [font=default-semibold]out.set(d)[/font] – replaces the outputs with set d (only the difference goes to the wire).\n• [font=default-semibold]out.add(d)[/font] – adds set d to the outputs.\nOperations can be chained: out.set(inp.where(">", 0).each("*", 2)).\n\n[font=default-bold]Stateful elements[/font] – state under a name (first argument) survives saves, Reset clears it. Every element needs its own name:\n• [font=default-semibold]latch(name, set, reset)[/font] – flip-flop: set turns it on, reset off (reset wins). Returns True/False.\n   Example: on = latch("pump", level < 1000, level > 20000)\n• [font=default-semibold]timer(name, period)[/font] – True once every period ticks, otherwise False.\n• [font=default-semibold]edge(name, value)[/font] – edge: 1 when the value just became true, -1 when it just stopped, otherwise 0.\n• [font=default-semibold]counter(name, step=1, reset=False)[/font] – counter; every call adds step, reset sets it to zero.\n• [font=default-semibold]delay(name, value, n)[/font] – the value from n loop() calls ago (0 until filled; n ≤ 1000).\n• [font=default-semibold]pid(name, setpoint, measured, kp, ki, kd, lo, hi)[/font] – PID controller; returns the control output. lo and hi are optional limits with integral protection (anti-windup).
