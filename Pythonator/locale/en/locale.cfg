pyntr-pythonator=A programmable controller for the circuit network: replace tangled combinator setups with readable Python-like code.

[mod-setting-name]
pyntr-watchdog-limit=Pythonator: operation limit per tick
pyntr-memory-limit=Pythonator: memory limit

[mod-setting-description]
pyntr-watchdog-limit=How much work one program may do in a single run of loop() or initialization (loop iterations, function calls, elements processed by built-in functions). Over the limit the program stops with an error.
pyntr-memory-limit=How many elements (list, tuple and dict items; long strings count by length) the global variables of one program may hold. Over the limit the program stops with an error.

[mod-name]
