help-title=Pythonator help
help-insert=Insert into editor
tooltip-help-insert=Replaces the editor text with this example (only while paused). Run it with ▶.
help-basics-title=Basics
help-basics-text=A program must define [font=default-bold]loop()[/font]. Pythonator calls it once per tick (or once per interval from config()). Top-level code runs once on start – that is the initialization.\n\n[font=default-bold]Timing:[/font] in tick T the inputs are read (what others sent in T−1), loop() runs and the outputs are written. Others see them in tick T+1 – exactly like a vanilla combinator. loop() always finishes within one tick.\n\n[font=default-bold]State:[/font] global variables keep their value between ticks and across saves. Assigning to a global inside a function needs "global name" (as in Python). Local variables are dropped when the function returns.\n\n[font=default-bold]Time:[/font] tick = ticks the program has run (stops while paused and without power), game_tick = game tick, dt = ticks since the previous loop().\nconfig(interval=N, outputs="hold" | "clear") – only as a top-level statement.\n\n[font=default-bold]Controls:[/font] ▶ runs (changed code is compiled and starts from scratch, otherwise the program continues), ⏸ pauses, ⟳ resets (globals from scratch), ⏭ runs one loop() while paused. The editor is read-only while running – edit while paused.\n\nIndent with spaces – the Tab key does nothing in the editor (pasted text with tabs works). Insert a signal icon with the selector in the editor corner.
help-signals-title=Signals
help-signals-text=[font=default-bold]Reading:[/font] inp[k] = sum of both wires, red[k] and green[k] = one wire only. A missing signal reads 0.\n[font=default-bold]Writing:[/font] out[k] = value (both wires), out_red[k], out_green[k]. The value is truncated towards zero and wraps to int32 like the circuit network.\n\n[font=default-bold]Keys:[/font] "iron-plate", "iron-plate@rare" (quality), "recipe:iron-plate", "entity:…", or an icon [item=iron-plate] from the selector. Without a prefix an item, fluid or virtual signal is looked up; the compiler reports typos with a suggestion.\n\n[font=default-bold]Iterating:[/font] for k, v in inp.items(), .keys(), .values(), k in inp, len(inp), out.clear().\nconfig(outputs="hold") keeps outputs (default), "clear" clears them before every loop().\n\nSet an assembler recipe with the item signal: out["iron-gear-wheel"] = 1.\nThe Outputs panel shows the actual wire state (it does not change after a program error).
help-language-title=Language
help-language-text=A subset of Python – programs also run in CPython.\n\n[font=default-bold]Types:[/font] int, float, bool, None, str, list, dict, tuple.\n[font=default-bold]Statements:[/font] if/elif/else, while, for … in, break, continue, pass, def, return, global, unpacking a, b = …, += …\n[font=default-bold]Operators:[/font] + - * / // % **, comparisons incl. chained 0 < x < 10, and or not, in, is, a if c else b, bitwise & | ^ ~ << >> (32 bits).\n[font=default-bold]Built-ins:[/font] abs min max round int float str bool len range sum sorted print.\n[font=default-bold]Methods:[/font] list append pop insert remove index clear; dict get items keys values pop clear; str upper lower startswith endswith split join replace.\n\n[font=default-bold]Not supported:[/font] classes, import, try/except, lambda, comprehensions, f-strings, with, default and keyword arguments, nested def, set, del.\n[font=default-bold]Differences:[/font] int and float are not distinguished (6 / 2 prints 3), top-level defs are available before their definition.\n\n[font=default-bold]Safety limits:[/font] the watchdog stops a program doing more operations in one tick than the limit (the cost of the last run is in the status panel); the memory limit watches the size of global variables. Both are map settings.\nprint() writes to the window log (last 50 lines).
help-library-title=Library
help-library-text=[font=default-bold]Vector operations[/font] – on inp, red, green, out… and on dict, in one call:\nx.each(op, v) – every signal op v like an arithmetic combinator: + - * / % ** << >> & | ^ (integers, / and % towards zero, division by zero = 0)\nx.where(op, v) – only signals matching < <= > >= == != (like Each in a decider combinator)\nx.count(), x.count(op, v), x.sum(), x.max_key(), x.min_key() (ties: smaller key)\nout.set(d) – replaces the outputs with set d, out.add(d) – adds it\nExample: out.set(inp.where(">", 0).each("*", 2))\n\n[font=default-bold]Stateful elements[/font] – state under a name survives saves, Reset clears it; every element needs its own name:\nlatch(name, set, reset) → True/False, reset wins\ntimer(name, period) → True once every period ticks\nedge(name, value) → 1 rising edge, -1 falling, 0 none\ncounter(name, step=1, reset=False) → count\ndelay(name, value, n) → the value from n loop() calls ago (0 until filled; n ≤ 1000)\npid(name, setpoint, measured, kp, ki, kd, lo, hi) → control output; lo and hi are optional limits with integral protection (anti-windup)
