help-title=Nápověda Pythonatoru
help-insert=Vložit do editoru
tooltip-help-insert=Nahradí text v editoru tímto příkladem (jen při pauze). Spustíš ho tlačítkem ▶.
help-basics-title=Základy
help-basics-text=Program musí mít funkci [font=default-bold]loop()[/font]. Pythonator ji volá jednou za tick (nebo jednou za interval z config()). Kód na nejvyšší úrovni proběhne jednou při spuštění – to je inicializace.\n\n[font=default-bold]Časování:[/font] v ticku T se načtou vstupy (co ostatní poslali v T−1), proběhne loop() a zapíšou se výstupy. Ostatní je uvidí v ticku T+1 – stejně jako u vanilla kombinátoru. loop() vždy doběhne v jednom ticku.\n\n[font=default-bold]Stav:[/font] globální proměnné drží hodnotu mezi ticky i po uložení hry. Přiřazení do globální proměnné ve funkci vyžaduje „global jméno“ (jako v Pythonu). Lokální proměnné se po návratu z funkce zahodí.\n\n[font=default-bold]Čas:[/font] tick = ticky běhu programu (stojí při pauze a bez proudu), game_tick = tick hry, dt = ticků od minulého loop().\nconfig(interval=N, outputs="hold" | "clear") – jen jako příkaz na nejvyšší úrovni.\n\n[font=default-bold]Ovládání:[/font] ▶ spustí (změněný kód se přeloží a začne od nuly, jinak program pokračuje), ⏸ pozastaví, ⟳ reset (globální proměnné od nuly), ⏭ jeden loop() při pauze. Za běhu je editor jen pro čtení – upravuj při pauze.\n\nOdsazuj mezerami – klávesa Tab v editoru nefunguje (vložený text s tabulátory funguje). Ikonu signálu vložíš výběrem v rohu editoru.
help-signals-title=Signály
help-signals-text=[font=default-bold]Čtení:[/font] inp[k] = součet obou drátů, red[k] a green[k] = jen jeden drát. Chybějící signál čte 0.\n[font=default-bold]Zápis:[/font] out[k] = hodnota (oba dráty), out_red[k], out_green[k]. Hodnota se ořízne na celé číslo směrem k nule a přeteče do int32 jako v obvodové síti.\n\n[font=default-bold]Klíče:[/font] "iron-plate", "iron-plate@rare" (kvalita), "recipe:iron-plate", "entity:…", nebo ikona [item=iron-plate] z výběru. Bez prefixu se hledá předmět, tekutina nebo virtuální signál; překlep ohlásí překladač s návrhem.\n\n[font=default-bold]Procházení:[/font] for k, v in inp.items(), .keys(), .values(), k in inp, len(inp), out.clear().\nconfig(outputs="hold") výstupy drží (výchozí), "clear" je před každým loop() vymaže.\n\nMontovně nastavíš recept signálem předmětu: out["iron-gear-wheel"] = 1.\nPanel Výstupy ukazuje skutečný stav drátu (po chybě programu se nezmění).
help-language-title=Jazyk
help-language-text=Podmnožina Pythonu – programy jdou spustit i v CPythonu.\n\n[font=default-bold]Typy:[/font] int, float, bool, None, str, list, dict, tuple.\n[font=default-bold]Příkazy:[/font] if/elif/else, while, for … in, break, continue, pass, def, return, global, rozbalení a, b = …, += …\n[font=default-bold]Operátory:[/font] + - * / // % **, porovnání i řetězené 0 < x < 10, and or not, in, is, a if c else b, bitové & | ^ ~ << >> (32 bitů).\n[font=default-bold]Vestavěné:[/font] abs min max round int float str bool len range sum sorted print.\n[font=default-bold]Metody:[/font] list append pop insert remove index clear; dict get items keys values pop clear; str upper lower startswith endswith split join replace.\n\n[font=default-bold]Není:[/font] třídy, import, try/except, lambda, comprehensions, f-stringy, with, výchozí a pojmenované argumenty, vnořené def, set, del.\n[font=default-bold]Odchylky:[/font] int a float se nerozlišují (6 / 2 vypíše 3), def na nejvyšší úrovni jsou dostupné i před definicí.\n\n[font=default-bold]Pojistky:[/font] watchdog zastaví program, který v jednom ticku udělá víc operací než limit (cena posledního běhu je v panelu stavu); limit paměti hlídá velikost globálních proměnných. Obojí je v nastavení mapy.\nprint() píše do logu okna (posledních 50 řádků).
help-library-title=Knihovna
help-library-text=[font=default-bold]Vektorové operace[/font] – nad inp, red, green, out… i nad dict, jedním voláním:\nx.each(op, v) – každý signál op v jako aritmetický kombinátor: + - * / % ** << >> & | ^ (celá čísla, / a % k nule, dělení nulou = 0)\nx.where(op, v) – jen signály splňující podmínku < <= > >= == != (jako Each v rozhodovacím kombinátoru)\nx.count(), x.count(op, v), x.sum(), x.max_key(), x.min_key() (při shodě menší klíč)\nout.set(d) – výstupy nahradí sadou d, out.add(d) – přičte\nPříklad: out.set(inp.where(">", 0).each("*", 2))\n\n[font=default-bold]Stavové prvky[/font] – stav pod jménem přežije uložení, Reset ho smaže; každý prvek potřebuje vlastní jméno:\nlatch(jméno, set, reset) → True/False, přednost má reset\ntimer(jméno, perioda) → True jednou za periodu ticků\nedge(jméno, hodnota) → 1 náběžná hrana, -1 sestupná, 0 žádná\ncounter(jméno, krok=1, reset=False) → počet\ndelay(jméno, hodnota, n) → hodnota z doby před n voláními loop() (do naplnění 0; n ≤ 1000)\npid(jméno, žádaná, měřená, kp, ki, kd, lo, hi) → akční veličina; lo a hi jsou volitelné meze s ochranou integrálu (anti-windup)
help-examples-title=Příklady
help-examples-text=Příklad vložíš do editoru při pauze tlačítkem pod ním (nahradí text v editoru) a spustíš tlačítkem ▶.
help-example-hysteresis-title=Hystereze
help-example-hysteresis-desc=Čerpadlo (signal-S) zapne, když plyn klesne pod 1000, a vypne nad 20000. Hladina se mění pomalu, stačí kontrola každých 10 ticků (config(interval=10)). Stejná hodnota zapsaná znovu se na drát neposílá, nic nestojí.
help-example-sequence-title=Sekvence s časovačem
help-example-sequence-desc=Jednou za sekundu (config(interval=60) – loop() běží jen každý 60. tick) posune krok sekvence a vysílá signál A, B, S, U dokola.
help-example-recipe-title=Recept do montovny
help-example-recipe-desc=Montovna s „Nastavit recept“ dostane signál předmětu – vyrábí ozubená kola, dokud jich v síti není 200. Výstup se nastaví podmínkou místo out.clear() (žádný zbytečný zápis) a stačí kontrola dvakrát za sekundu.
help-example-each-title=Přebytky (Each)
help-example-each-desc=Jednou za sekundu pošle přebytky všech signálů nad 1000 a na signal-A jejich počet. Síť se projde jednou (where), výsledek a počet jdou do jedné sady a out.set() zapíše na drát jen rozdíl.
help-example-pid-title=PID regulace
help-example-pid-desc=Drží hladinu plynu na 5000; akční veličina 0–100 jde na signal-P (např. rychlost čerpání). Regulace běží každý tick; pid() počítá s dt, takže funguje i s config(interval=N), jen reaguje pomaleji.
help-performance-title=Výkon
help-performance-text=Každé spuštění loop() stojí čas procesoru (UPS). Hra má na jeden tick 16,7 ms; cenu všech Pythonatorů uvidíš přes F4 → show-time-usage → řádek mod-Pythonator. Cenu jednoho programu ukazuje pruh v okně.\n\n[font=default-bold]1. Interval – největší úspora.[/font] config(interval=N) spustí loop() jen každý N-tý tick, cena klesne zhruba na 1/N. Rychlost reakce volte podle úlohy:\n• 1 – bezpečnost, regulace, rychlé sekvence vlaků a inserterů\n• 10–60 – výroba, sklady, hladiny tekutin\n• 300 a víc – pomalé věci (výzkum, statistiky, přepínání podle času)\nBudovy se stejným intervalem běží každá v jiném ticku (rozložení podle čísla budovy), takže nevzniká špička.\n\n[font=default-bold]2. Výstup zapisuj jen při změně.[/font] out.clear() a nový zápis každý tick stojí víc než samotný program. Zapisuj uvnitř podmínky, která změnu pozná (if timer(…), if edge(…), když se změní hodnota).\n\n[font=default-bold]3. Čti jen to, co potřebuješ.[/font] inp["x"] stojí asi 1 µs za signál; procházení všech signálů (inp.items(), inp.where(…)) načte celou síť – při desítkách signálů desítky µs. Budovy na stejné síti si načtení v jednom ticku sdílí.\n\n[font=default-bold]4. Orientační čísla (150 budov s jednoduchým programem):[/font]\n• každý tick s out.clear() + zápisem: ~2,4 ms za tick (~16 µs na budovu)\n• každý tick, zápis jen při změně: ~1,2 ms (~8 µs na budovu; ~3 µs je pevná režie spuštění)\n• config(interval=60): ~0,2 ms\nPár desítek programů s intervalem 1 je v pořádku i ve velké továrně; stovky budov s intervalem 1 už je vhodné ladit.
