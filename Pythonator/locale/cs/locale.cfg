[entity-description]
pyntr-pythonator=Programovatelný kontrolér obvodové sítě. Řídicí logiku píšeš v podmnožině Pythonu: každý tick se načtou vstupy, proběhne loop() a zapíšou se výstupy – deterministicky, se zpožděním 1 tick jako kombinátor.

