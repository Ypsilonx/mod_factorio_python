[mod-setting-name]
pyntr-watchdog-limit=Pythonator: limit operací za tick
pyntr-memory-limit=Pythonator: limit paměti

[mod-setting-description]
pyntr-watchdog-limit=Kolik práce smí jeden program udělat při jednom běhu loop() nebo inicializace (průchody cyklem, volání funkcí, prvky zpracované vestavěnými funkcemi). Nad limitem se program zastaví s chybou.
pyntr-memory-limit=Kolik prvků (položek list, tuple a dict; dlouhé řetězce podle délky) smí držet globální proměnné jednoho programu. Nad limitem se program zastaví s chybou.

[mod-name]
Pythonator=Pythonator

[mod-description]
Pythonator=Programovatelný obvodový kontrolér skriptovaný v podmnožině Pythonu.

