help-basics-title=Základy
help-basics-text=Program musí mít funkci [font=default-bold]loop()[/font]. Pythonator ji volá jednou za tick (nebo jednou za interval z config()). Kód na nejvyšší úrovni proběhne jednou při spuštění – to je inicializace.\n\n[font=default-bold]Časování:[/font] v ticku T se načtou vstupy (co ostatní poslali v T−1), proběhne loop() a zapíšou se výstupy. Ostatní je uvidí v ticku T+1 – stejně jako u vanilla kombinátoru. loop() vždy doběhne v jednom ticku.\n\n[font=default-bold]Stav:[/font] globální proměnné drží hodnotu mezi ticky i po uložení hry. Přiřazení do globální proměnné ve funkci vyžaduje „global jméno“ (jako v Pythonu). Lokální proměnné se po návratu z funkce zahodí.\n\n[font=default-bold]Čas:[/font] tick = ticky běhu programu (stojí při pauze a bez proudu), game_tick = tick hry, dt = ticků od minulého loop().\n\n[font=default-bold]Nastavení programu[/font] – interval, mazání výstupů, popis a ikona budovy – je config(…) na začátku programu (karta config()).\n\n[font=default-bold]Ovládání:[/font] ▶ spustí (změněný kód se přeloží a začne od nuly, jinak program pokračuje), ⏸ pozastaví, ⟳ reset (globální proměnné od nuly), ⏭ jeden loop() při pauze. Za běhu je editor jen pro čtení – upravuj při pauze.\n\nOdsazuj mezerami – klávesa Tab v editoru nefunguje (vložený text s tabulátory funguje). Hotové kusy kódu vložíš lištou šablon pod editorem, ikonu signálu výběrem v rohu editoru (karta Okno a ALT).
help-signals-title=Signály
help-language-title=Jazyk
help-library-title=Knihovna
help-examples-title=Příklady
help-examples-text=Příklad vložíš do editoru při pauze tlačítkem pod ním (nahradí text v editoru) a spustíš tlačítkem ▶.
help-example-hysteresis-title=Hystereze
help-example-hysteresis-desc=Čerpadlo (signal-S) zapne, když plyn klesne pod 1000, a vypne nad 20000. Hladina se mění pomalu, stačí kontrola každých 10 ticků (config(interval=10)). Stejná hodnota zapsaná znovu se na drát neposílá, nic nestojí.
help-example-sequence-title=Sekvence s časovačem
help-example-sequence-desc=Jednou za sekundu (config(interval=60) – loop() běží jen každý 60. tick) posune krok sekvence a vysílá signál A, B, S, U dokola.
help-example-recipe-title=Recept do montovny
help-example-recipe-desc=Montovna s „Nastavit recept“ dostane signál předmětu – vyrábí ozubená kola, dokud jich v síti není 200. Výstup se nastaví podmínkou místo out.clear() (žádný zbytečný zápis) a stačí kontrola dvakrát za sekundu.
help-example-each-title=Přebytky (Each)
help-example-each-desc=Jednou za sekundu pošle přebytky všech signálů nad 1000 a na signal-A jejich počet. Síť se projde jednou (where), výsledek a počet jdou do jedné sady a out.set() zapíše na drát jen rozdíl.
help-example-pid-title=PID regulace
help-example-pid-desc=Drží hladinu plynu na 5000; akční veličina 0–100 jde na signal-P (např. rychlost čerpání). Regulace běží každý tick; pid() počítá s dt, takže funguje i s config(interval=N), jen reaguje pomaleji.
help-performance-title=Výkon
help-performance-text=Každé spuštění loop() stojí čas procesoru (UPS). Hra má na jeden tick 16,7 ms; cenu všech Pythonatorů uvidíš přes F4 → show-time-usage → řádek mod-Pythonator. Cenu jednoho programu ukazuje pruh v okně.\n\n[font=default-bold]1. Interval – největší úspora.[/font] config(interval=N) spustí loop() jen každý N-tý tick, cena klesne zhruba na 1/N. Rychlost reakce volte podle úlohy:\n• 1 – bezpečnost, regulace, rychlé sekvence vlaků a inserterů\n• 10–60 – výroba, sklady, hladiny tekutin\n• 300 a víc – pomalé věci (výzkum, statistiky, přepínání podle času)\nBudovy se stejným intervalem běží každá v jiném ticku (rozložení podle čísla budovy), takže nevzniká špička.\n\n[font=default-bold]2. Výstup zapisuj jen při změně.[/font] out.clear() a nový zápis každý tick stojí víc než samotný program. Zapisuj uvnitř podmínky, která změnu pozná (if timer(…), if edge(…), když se změní hodnota).\n\n[font=default-bold]3. Čti jen to, co potřebuješ.[/font] inp["x"] stojí asi 1 µs za signál; procházení všech signálů (inp.items(), inp.where(…)) načte celou síť – při desítkách signálů desítky µs. Budovy na stejné síti si načtení v jednom ticku sdílí.\n\n[font=default-bold]4. Orientační čísla (150 budov s jednoduchým programem):[/font]\n• každý tick s out.clear() + zápisem: ~2,4 ms za tick (~16 µs na budovu)\n• každý tick, zápis jen při změně: ~1,2 ms (~8 µs na budovu; ~3 µs je pevná režie spuštění)\n• config(interval=60): ~0,2 ms\nPár desítek programů s intervalem 1 je v pořádku i ve velké továrně; stovky budov s intervalem 1 už je vhodné ladit.
help-signals-text=[font=default-bold]Čtení vstupů[/font] (chybějící signál čte 0):\n• [font=default-semibold]inp[k][/font] – součet červeného a zeleného drátu, jako vstup kombinátoru.\n• [font=default-semibold]red[k][/font], [font=default-semibold]green[k][/font] – jen jeden drát.\n\n[font=default-bold]Zápis výstupů[/font] (hodnota se ořízne na celé číslo k nule a přeteče do int32):\n• [font=default-semibold]out[k] = v[/font] – na oba dráty.\n• [font=default-semibold]out_red[k] = v[/font], [font=default-semibold]out_green[k] = v[/font] – jen na jeden drát; na drátu se sečte s out.\n• [font=default-semibold]out.clear()[/font] – smaže výstupy daného objektu (out_red.clear() jen červené).\n\n[font=default-bold]Klíče signálů:[/font]\n• "iron-plate" – předmět, tekutina nebo virtuální signál podle jména.\n• "iron-plate@rare" – s kvalitou.\n• "recipe:iron-plate", "entity:…", "space-location:…" – jiný typ signálu.\n• Ikona z výběru v rohu editoru, např. [item=iron-plate] – totéž jako text, bez uvozovek i v nich.\nPřeklep v klíči ohlásí překladač i s návrhem správného jména.\n\n[font=default-bold]Procházení:[/font]\n• [font=default-semibold]for k, v in inp.items():[/font] – všechny nenulové signály (také .keys(), .values()).\n• [font=default-semibold]k in inp[/font], [font=default-semibold]len(inp)[/font] – je signál nenulový, kolik jich je.\n\n[font=default-bold]Režim výstupů:[/font]\n• config(outputs="hold") – výstupy drží poslední hodnotu (výchozí).\n• config(outputs="clear") – výstupy se před každým loop() vymažou.\n\nMontovně nastavíš recept signálem předmětu: out["iron-gear-wheel"] = 1.\nPanel Výstupy v okně budovy ukazuje skutečný stav drátu.
help-language-text=Podmnožina Pythonu – program jde spustit i v normálním Pythonu.\n\n[font=default-bold]Typy:[/font] int, float, bool (True/False), None, str, list [1, 2], dict {"a": 1}, tuple (1, 2).\n\n[font=default-bold]Příkazy:[/font]\n• [font=default-semibold]if / elif / else[/font] – podmínka.\n• [font=default-semibold]while podmínka:[/font] – cyklus; [font=default-semibold]for x in …:[/font] – průchod range(), list, dict, inp.items() …\n• [font=default-semibold]break[/font], [font=default-semibold]continue[/font], [font=default-semibold]pass[/font].\n• [font=default-semibold]def jméno(a, b):[/font] … [font=default-semibold]return[/font] – vlastní funkce (jen na nejvyšší úrovni).\n• [font=default-semibold]global x[/font] – zápis do globální proměnné uvnitř funkce.\n• a, b = b, a – rozbalení; x += 1 a další zkrácená přiřazení.\n\n[font=default-bold]Operátory:[/font]\n• + - * / (vždy desetinné) // (celočíselné dělení) % ** (mocnina)\n• porovnání < <= > >= == != i řetězené 0 < x < 10\n• and, or, not, in, not in, is, a if podmínka else b\n• bitové & | ^ ~ << >> (32 bitů jako obvodová síť)\n\n[font=default-bold]Vestavěné funkce:[/font]\n• abs, min, max, round, sum, sorted, len, range – jako v Pythonu.\n• int, float, str, bool – převody.\n• print(…) – zápis do logu okna (posledních 50 řádků).\n\n[font=default-bold]Metody:[/font]\n• list: append, pop, insert, remove, index, clear\n• dict: get, items, keys, values, pop, clear\n• str: upper, lower, startswith, endswith, split, join, replace\n\n[font=default-bold]Není:[/font] třídy, import, try/except, lambda, comprehensions, f-stringy, with, výchozí a pojmenované argumenty, vnořené def, set, del.\n[font=default-bold]Odchylky:[/font] int a float se nerozlišují (6 / 2 vypíše 3); def na nejvyšší úrovni jsou dostupné i před definicí.\n\n[font=default-bold]Pojistky:[/font] watchdog zastaví program, který v jednom ticku udělá víc operací než limit; limit paměti hlídá velikost globálních proměnných. Obojí v nastavení mapy.
help-library-text=[font=default-bold]Vektorové operace[/font] – jedním voláním nad celou sadou signálů (inp, red, green, out… i dict). Pracují jako „Each“ u vanilla kombinátorů:\n• [font=default-semibold]x.each(op, v)[/font] – na každý signál použije op s číslem v; vrátí dict. op: + - * / % ** << >> & | ^; celá čísla, / a % k nule, dělení nulou dá 0.\n   inp.each("*", 2) → každý signál dvakrát.\n• [font=default-semibold]x.where(op, v)[/font] – jen signály splňující podmínku (op: < <= > >= == !=), s původní hodnotou.\n   inp.where(">", 1000) → signály nad 1000.\n• [font=default-semibold]x.count()[/font], [font=default-semibold]x.count(op, v)[/font] – počet signálů (případně jen splňujících podmínku).\n• [font=default-semibold]x.sum()[/font] – součet hodnot.\n• [font=default-semibold]x.max_key()[/font], [font=default-semibold]x.min_key()[/font] – jméno signálu s největší / nejmenší hodnotou (při shodě abecedně první), u prázdné sady None.\n• [font=default-semibold]out.set(d)[/font] – výstupy nahradí sadou d (na drát jde jen rozdíl). [font=default-semibold]out.add(d)[/font] – sadu d k výstupům přičte.\nOperace jdou řetězit: out.set(inp.where(">", 0).each("*", 2)).\n\n[font=default-bold]Stavové prvky[/font] si pamatují stav mezi ticky. Prvním argumentem je vždy [font=default-semibold]jméno[/font] (text): pod ním je stav uložený, přežije uložení hry a Reset ho smaže. Každý prvek potřebuje vlastní jméno – dvě volání se stejným jménem sdílí jeden stav. Stav všech prvků ukazuje panel „Prvky knihovny“. Argumenty se předávají jen pozičně (bez jméno=hodnota).\n\n[font=default-semibold]latch(jméno, set, reset)[/font] → True/False\nKlopný obvod – jednobitová paměť. Když platí set, zapne se; když platí reset, vypne se; když platí obojí, vypne se (reset má přednost); když ani jedno, drží předchozí stav.\n   on = latch("pumpa", plyn < 1000, plyn > 20000) → zapne pod 1000, vypne nad 20000, mezi tím drží (hystereze).\n\n[font=default-semibold]timer(jméno, perioda)[/font] → True/False\nTrue jednou za periodu ticků hry, jinak False. Počítá s dt, takže funguje i s interval (perioda 60 s interval=10 = každé 6. volání). Po výpadku proudu vystřelí jen jednou.\n   if timer("hlášení", 300): print(inp["iron-plate"]) → každých 5 sekund.\n\n[font=default-semibold]edge(jméno, hodnota)[/font] → 1 / -1 / 0\nHrana: 1 v tom loop(), kdy hodnota začala platit, -1 když přestala, jinak 0. Na akci, která má proběhnout jen jednou při změně.\n   if edge("plno", inp["iron-plate"] > 1000) == 1: print("plno")\n\n[font=default-semibold]counter(jméno)[/font], [font=default-semibold]counter(jméno, krok)[/font], [font=default-semibold]counter(jméno, krok, reset)[/font] → číslo\nPočítadlo: každé volání přičte krok (výchozí 1, může být záporný). Když platí reset, vynuluje se a vrátí 0.\n   n = counter("vlaky", 1, inp["signal-R"] > 0) → počítá, signal-R vynuluje.\n\n[font=default-semibold]delay(jméno, hodnota, n)[/font] → hodnota\nZpoždění: vrátí hodnotu, kterou dostal před n voláními (n = 1–1000). Dokud se nenaplní, vrací 0; změna n ho vymaže. Počítá volání loop(), ne ticky: s interval=10 a n=6 je zpoždění 60 ticků.\n   zmena = inp["iron-plate"] - delay("pred", inp["iron-plate"], 60) → přírůstek za 60 volání.\n\n[font=default-semibold]pid(jméno, žádaná, měřená, kp, ki, kd)[/font], [font=default-semibold]pid(…, lo, hi)[/font] → číslo\nPID regulátor drží měřenou hodnotu (třeba hladinu v nádrži) na žádané tím, že vrací akční veličinu – hodnotu, kterou pošleš na výstup (rychlost čerpání, počet zapnutých strojů …). Počítá s [font=default-semibold]chybou[/font] e = žádaná − měřená (kladná = měřené je málo):\n• [font=default-semibold]kp[/font] (proporcionální) – výstup = kp × e. Reaguje okamžitě, čím větší odchylka, tím silněji. Sám ale obvykle nechá malou trvalou odchylku.\n• [font=default-semibold]ki[/font] (integrační) – sčítá chybu v čase (za každý tick) a výstup postupně přidává, dokud odchylka úplně nezmizí. Příliš velké ki = kmitání a překmity.\n• [font=default-semibold]kd[/font] (derivační) – reaguje na rychlost změny chyby a tlumí překmity. Ve Factoriu většinou 0 – signály skáčou a derivace by zesilovala šum.\n• [font=default-semibold]lo, hi[/font] (volitelné) – meze výstupu, např. 0 a 100. Výstup se na ně ořízne a integrál přestane růst, když výstup stojí na mezi (anti-windup) – po dlouhém nedostatku pak regulátor nepřestřelí.\nJak nastavit: začni s ki = kd = 0 a zvyšuj kp, dokud výstup rozumně reaguje na odchylku; pak přidej malé ki (třeba kp / 100) a zvyšuj, dokud trvalá odchylka nezmizí; když hodnota kmitá, zmenši ki (případně i kp). Integrál se počítá v ticích, proto bývá ki malé (0,001–0,01).\n   u = pid("hladina", 5000, inp["petroleum-gas"], 0.02, 0.001, 0, 0, 100)\n   out["signal-P"] = u → výsledek je desetinné číslo, na drát jde oříznuté na celé.
help-config-title=config()
help-config-text=[font=default-bold]config(…)[/font] nastavuje celý program. Píše se jako samostatný příkaz na nejvyšší úrovni (ne uvnitř funkce), nejlépe na první řádek. Hodnoty musí být napsané přímo (číslo, text v uvozovkách), ne v proměnné – čtou se už při překladu. Každý parametr je volitelný a config() můžeš vynechat úplně.\n\nPříklad:\n[font=pyntr-mono]config(interval=10, outputs="clear", label="Hlídání plynu", icon="petroleum-gas")[/font]\n\n[font=default-bold]interval=N[/font] – celé číslo ≥ 1, výchozí 1\nloop() se spustí jen každý N-tý tick (60 = jednou za sekundu). Budova je tím zhruba N-krát levnější (karta Výkon). dt v loop() je pak N; timer() a pid() s tím počítají samy, delay() počítá volání loop(), ne ticky.\n\n[font=default-bold]outputs="hold" | "clear"[/font] – výchozí "hold"\n• "hold" – výstup drží naposledy zapsanou hodnotu, dokud ji nepřepíšeš, nezapíšeš 0 nebo nezavoláš out.clear(). Hodí se, když zapisuješ jen při změně.\n• "clear" – před každým loop() se všechny výstupy vymažou; na drátu je jen to, co loop() zapsal v tomto běhu. Hodí se, když výstup vždy plyne z aktuálních vstupů (nezapomeneš nic smazat).\n\n[font=default-bold]label="text"[/font]\nPopis budovy. Ukáže se v bublině, když na budovu najedeš myší – je hned jasné, co dělá, bez otevírání okna. Je součástí kódu, takže se přenáší s blueprintem i kopírováním nastavení.\n\n[font=default-bold]icon="signál"[/font]\nIkona uprostřed budovy, vidět pořád (i bez ALT). Zapisuje se jako klíč signálu: "iron-plate", "petroleum-gas", "signal-A", "iron-plate@rare", nebo ikonou z výběru v rohu editoru (bez uvozovek i v nich). Překlep ohlásí překladač i s návrhem správného jména.\n\nNeznámý parametr nebo špatná hodnota je chyba překladu s číslem řádku. V normálním Pythonu je config() jen prázdná funkce – program tam běží beze změny.
help-window-title=Okno a ALT
help-window-text=[font=default-bold]Lišta šablon[/font] pod editorem vloží hotový kus kódu. Hra neprozradí, kde je kurzor, proto se šablona vloží tam, kde jsi naposledy psal – ne tam, kam jsi klikl myší:\n• výraz (inp[ ], .where, .each) přímo na to místo,\n• příkaz (def loop, if, out[ ] =, latch …) na nový řádek pod něj se stejným odsazením (za řádkem končícím dvojtečkou o úroveň víc); stojíš-li na prázdném řádku, vloží se na něj.\nPrvní slovo VELKÝMI písmeny (SIGNAL, NUMBER, NAME …) je po vložení označené – stačí psát a přepíše se. Nenahrazené zástupné slovo ohlásí překladač jako chybu. Bublina tlačítka ukáže celý kód šablony.\n\n[font=default-bold]Výběr ikony[/font] v pravém dolním rohu editoru vloží ikonu signálu, např. [item=iron-plate]. Funguje bez uvozovek i v nich – inp[[item=iron-plate]] i inp["[item=iron-plate]"] – takže nemusíš znát anglické jméno signálu.\n\n[font=default-bold]Panely vpravo:[/font] stav programu a cena posledního běhu, signály na vstupních drátech, výstupy (skutečný stav drátu), globální proměnné a stav prvků knihovny. Tlačítko Log pod editorem ukáže posledních 50 řádků print().\n\n[font=default-bold]Na budově:[/font]\n• LED – zelená bliká: běží, žlutá: pauza, červená: chyba, zhasnutá: bez kódu nebo bez proudu.\n• Displej za běhu roluje kódem.\n• Ikona z config(icon=…) uprostřed, popis z config(label=…) v bublině při najetí myší.\n\n[font=default-bold]ALT režim[/font] (klávesa Alt) ukáže nad každým Pythonatorem:\n• šipky na hraně – odkud vede vstup a kam jde výstup,\n• na straně vstupu signály, které program čte jménem (inp["…"], red["…"], green.get("…"), "…" in inp); ikona Each znamená, že čte celou sadu (inp.items(), .where(…), len(inp), klíč skládaný za běhu),\n• na straně výstupu signály, které budova právě posílá na dráty,\n• podklad ikony: tmavý = oba dráty (inp, out), červený = jen červený (red, out_red), zelený = jen zelený; víc signálů, než se vejde = „+N“.\nHodnoty signálů ALT neukazuje (jako u vanilla kombinátorů) – najdeš je v okně budovy.
tips-title=Pythonator – jak začít
tips-examples-text=Hotové programy. V okně budovy je vložíš do editoru tlačítkem v nápovědě (?) → Příklady.
