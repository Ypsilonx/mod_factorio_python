help-basics-title=Základy
help-basics-text=Program musí mít funkci [font=default-bold]loop()[/font]. Pythonator ji volá jednou za tick (nebo jednou za interval z config()). Kód na nejvyšší úrovni proběhne jednou při spuštění – to je inicializace.\n\n[font=default-bold]Časování:[/font] v ticku T se načtou vstupy (co ostatní poslali v T−1), proběhne loop() a zapíšou se výstupy. Ostatní je uvidí v ticku T+1 – stejně jako u vanilla kombinátoru. loop() vždy doběhne v jednom ticku.\n\n[font=default-bold]Stav:[/font] globální proměnné drží hodnotu mezi ticky i po uložení hry. Přiřazení do globální proměnné ve funkci vyžaduje „global jméno“ (jako v Pythonu). Lokální proměnné se po návratu z funkce zahodí.\n\n[font=default-bold]Čas:[/font] tick = ticky běhu programu (stojí při pauze a bez proudu), game_tick = tick hry, dt = ticků od minulého loop().\nconfig(interval=N, outputs="hold" | "clear") – jen jako příkaz na nejvyšší úrovni.\n\n[font=default-bold]Ovládání:[/font] ▶ spustí (změněný kód se přeloží a začne od nuly, jinak program pokračuje), ⏸ pozastaví, ⟳ reset (globální proměnné od nuly), ⏭ jeden loop() při pauze. Za běhu je editor jen pro čtení – upravuj při pauze.\n\nOdsazuj mezerami – klávesa Tab v editoru nefunguje (vložený text s tabulátory funguje). Ikonu signálu vložíš výběrem v rohu editoru.
help-signals-title=Signály
help-language-title=Jazyk
help-library-title=Knihovna
help-examples-title=Příklady
help-examples-text=Příklad vložíš do editoru při pauze tlačítkem pod ním (nahradí text v editoru) a spustíš tlačítkem ▶.
help-example-hysteresis-title=Hystereze
help-example-hysteresis-desc=Čerpadlo (signal-S) zapne, když plyn klesne pod 1000, a vypne nad 20000. Hladina se mění pomalu, stačí kontrola každých 10 ticků (config(interval=10)). Stejná hodnota zapsaná znovu se na drát neposílá, nic nestojí.
help-example-sequence-title=Sekvence s časovačem
help-example-sequence-desc=Jednou za sekundu (config(interval=60) – loop() běží jen každý 60. tick) posune krok sekvence a vysílá signál A, B, S, U dokola.
help-example-recipe-title=Recept do montovny
help-example-recipe-desc=Montovna s „Nastavit recept“ dostane signál předmětu – vyrábí ozubená kola, dokud jich v síti není 200. Výstup se nastaví podmínkou místo out.clear() (žádný zbytečný zápis) a stačí kontrola dvakrát za sekundu.
help-example-each-title=Přebytky (Each)
help-example-each-desc=Jednou za sekundu pošle přebytky všech signálů nad 1000 a na signal-A jejich počet. Síť se projde jednou (where), výsledek a počet jdou do jedné sady a out.set() zapíše na drát jen rozdíl.
help-example-pid-title=PID regulace
help-example-pid-desc=Drží hladinu plynu na 5000; akční veličina 0–100 jde na signal-P (např. rychlost čerpání). Regulace běží každý tick; pid() počítá s dt, takže funguje i s config(interval=N), jen reaguje pomaleji.
help-performance-title=Výkon
help-performance-text=Každé spuštění loop() stojí čas procesoru (UPS). Hra má na jeden tick 16,7 ms; cenu všech Pythonatorů uvidíš přes F4 → show-time-usage → řádek mod-Pythonator. Cenu jednoho programu ukazuje pruh v okně.\n\n[font=default-bold]1. Interval – největší úspora.[/font] config(interval=N) spustí loop() jen každý N-tý tick, cena klesne zhruba na 1/N. Rychlost reakce volte podle úlohy:\n• 1 – bezpečnost, regulace, rychlé sekvence vlaků a inserterů\n• 10–60 – výroba, sklady, hladiny tekutin\n• 300 a víc – pomalé věci (výzkum, statistiky, přepínání podle času)\nBudovy se stejným intervalem běží každá v jiném ticku (rozložení podle čísla budovy), takže nevzniká špička.\n\n[font=default-bold]2. Výstup zapisuj jen při změně.[/font] out.clear() a nový zápis každý tick stojí víc než samotný program. Zapisuj uvnitř podmínky, která změnu pozná (if timer(…), if edge(…), když se změní hodnota).\n\n[font=default-bold]3. Čti jen to, co potřebuješ.[/font] inp["x"] stojí asi 1 µs za signál; procházení všech signálů (inp.items(), inp.where(…)) načte celou síť – při desítkách signálů desítky µs. Budovy na stejné síti si načtení v jednom ticku sdílí.\n\n[font=default-bold]4. Orientační čísla (150 budov s jednoduchým programem):[/font]\n• každý tick s out.clear() + zápisem: ~2,4 ms za tick (~16 µs na budovu)\n• každý tick, zápis jen při změně: ~1,2 ms (~8 µs na budovu; ~3 µs je pevná režie spuštění)\n• config(interval=60): ~0,2 ms\nPár desítek programů s intervalem 1 je v pořádku i ve velké továrně; stovky budov s intervalem 1 už je vhodné ladit.
help-signals-text=[font=default-bold]Čtení vstupů[/font] (chybějící signál čte 0):\n• [font=default-semibold]inp[k][/font] – součet červeného a zeleného drátu, jako vstup kombinátoru.\n• [font=default-semibold]red[k][/font], [font=default-semibold]green[k][/font] – jen jeden drát.\n\n[font=default-bold]Zápis výstupů[/font] (hodnota se ořízne na celé číslo k nule a přeteče do int32):\n• [font=default-semibold]out[k] = v[/font] – na oba dráty.\n• [font=default-semibold]out_red[k] = v[/font], [font=default-semibold]out_green[k] = v[/font] – jen na jeden drát; na drátu se sečte s out.\n• [font=default-semibold]out.clear()[/font] – smaže výstupy daného objektu (out_red.clear() jen červené).\n\n[font=default-bold]Klíče signálů:[/font]\n• "iron-plate" – předmět, tekutina nebo virtuální signál podle jména.\n• "iron-plate@rare" – s kvalitou.\n• "recipe:iron-plate", "entity:…", "space-location:…" – jiný typ signálu.\n• Ikona z výběru v rohu editoru, např. [item=iron-plate] – totéž jako text.\nPřeklep v klíči ohlásí překladač i s návrhem správného jména.\n\n[font=default-bold]Procházení:[/font]\n• [font=default-semibold]for k, v in inp.items():[/font] – všechny nenulové signály (také .keys(), .values()).\n• [font=default-semibold]k in inp[/font], [font=default-semibold]len(inp)[/font] – je signál nenulový, kolik jich je.\n\n[font=default-bold]Režim výstupů:[/font]\n• config(outputs="hold") – výstupy drží poslední hodnotu (výchozí).\n• config(outputs="clear") – výstupy se před každým loop() vymažou.\n\nMontovně nastavíš recept signálem předmětu: out["iron-gear-wheel"] = 1.\nPanel Výstupy v okně budovy ukazuje skutečný stav drátu.
help-language-text=Podmnožina Pythonu – program jde spustit i v normálním Pythonu.\n\n[font=default-bold]Typy:[/font] int, float, bool (True/False), None, str, list [1, 2], dict {"a": 1}, tuple (1, 2).\n\n[font=default-bold]Příkazy:[/font]\n• [font=default-semibold]if / elif / else[/font] – podmínka.\n• [font=default-semibold]while podmínka:[/font] – cyklus; [font=default-semibold]for x in …:[/font] – průchod range(), list, dict, inp.items() …\n• [font=default-semibold]break[/font], [font=default-semibold]continue[/font], [font=default-semibold]pass[/font].\n• [font=default-semibold]def jméno(a, b):[/font] … [font=default-semibold]return[/font] – vlastní funkce (jen na nejvyšší úrovni).\n• [font=default-semibold]global x[/font] – zápis do globální proměnné uvnitř funkce.\n• a, b = b, a – rozbalení; x += 1 a další zkrácená přiřazení.\n\n[font=default-bold]Operátory:[/font]\n• + - * / (vždy desetinné) // (celočíselné dělení) % ** (mocnina)\n• porovnání < <= > >= == != i řetězené 0 < x < 10\n• and, or, not, in, not in, is, a if podmínka else b\n• bitové & | ^ ~ << >> (32 bitů jako obvodová síť)\n\n[font=default-bold]Vestavěné funkce:[/font]\n• abs, min, max, round, sum, sorted, len, range – jako v Pythonu.\n• int, float, str, bool – převody.\n• print(…) – zápis do logu okna (posledních 50 řádků).\n\n[font=default-bold]Metody:[/font]\n• list: append, pop, insert, remove, index, clear\n• dict: get, items, keys, values, pop, clear\n• str: upper, lower, startswith, endswith, split, join, replace\n\n[font=default-bold]Není:[/font] třídy, import, try/except, lambda, comprehensions, f-stringy, with, výchozí a pojmenované argumenty, vnořené def, set, del.\n[font=default-bold]Odchylky:[/font] int a float se nerozlišují (6 / 2 vypíše 3); def na nejvyšší úrovni jsou dostupné i před definicí.\n\n[font=default-bold]Pojistky:[/font] watchdog zastaví program, který v jednom ticku udělá víc operací než limit; limit paměti hlídá velikost globálních proměnných. Obojí v nastavení mapy.
help-library-text=[font=default-bold]Vektorové operace[/font] – jedním voláním nad celou sadou signálů (inp, red, green, out… i dict):\n• [font=default-semibold]x.each(op, v)[/font] – každý signál op v, jako Each v aritmetickém kombinátoru. op: + - * / % ** << >> & | ^; celá čísla, / a % k nule, dělení nulou dá 0. Výsledek je dict.\n   Příklad: inp.each("*", 2) → každý signál dvakrát.\n• [font=default-semibold]x.where(op, v)[/font] – jen signály splňující podmínku (op: < <= > >= == !=), s původní hodnotou – jako Each v rozhodovacím kombinátoru.\n   Příklad: inp.where(">", 1000) → signály nad 1000.\n• [font=default-semibold]x.count()[/font], [font=default-semibold]x.count(op, v)[/font] – počet signálů (případně jen splňujících podmínku).\n• [font=default-semibold]x.sum()[/font] – součet hodnot.\n• [font=default-semibold]x.max_key()[/font], [font=default-semibold]x.min_key()[/font] – klíč s největší / nejmenší hodnotou (při shodě menší klíč), u prázdné sady None.\n• [font=default-semibold]out.set(d)[/font] – výstupy nahradí sadou d (na drát jde jen rozdíl).\n• [font=default-semibold]out.add(d)[/font] – sadu d k výstupům přičte.\nOperace jdou řetězit: out.set(inp.where(">", 0).each("*", 2)).\n\n[font=default-bold]Stavové prvky[/font] – stav pod jménem (první argument) přežije uložení hry, Reset ho smaže. Každý prvek potřebuje vlastní jméno:\n• [font=default-semibold]latch(jméno, set, reset)[/font] – klopný obvod: set zapne, reset vypne (reset má přednost). Vrací True/False.\n   Příklad: on = latch("pumpa", hladina < 1000, hladina > 20000)\n• [font=default-semibold]timer(jméno, perioda)[/font] – True jednou za periodu ticků, jinak False.\n• [font=default-semibold]edge(jméno, hodnota)[/font] – hrana: 1 když hodnota právě začala platit, -1 když právě přestala, jinak 0.\n• [font=default-semibold]counter(jméno, krok=1, reset=False)[/font] – počítadlo; každé volání přičte krok, reset vynuluje.\n• [font=default-semibold]delay(jméno, hodnota, n)[/font] – hodnota z doby před n voláními loop() (do naplnění 0; n ≤ 1000).\n• [font=default-semibold]pid(jméno, žádaná, měřená, kp, ki, kd, lo, hi)[/font] – PID regulátor; vrací akční veličinu. lo a hi jsou volitelné meze s ochranou integrálu (anti-windup).
tips-title=Pythonator – jak začít
tips-examples-text=Hotové programy. V okně budovy je vložíš do editoru tlačítkem v nápovědě (?) → Příklady.
